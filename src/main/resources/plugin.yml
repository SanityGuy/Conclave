
name: Conclave
version: '${version}'
description: A configurable, permission-based staff chat plugin.
main: me.serenity.conclave.Conclave
api-version: '26.3'
load: POSTWORLD

authors:
  - SouyanDev

website: 'https://www.souyande.xyz'

commands:
  staffchat:
    description: Toggle staff chat or send a message to staff.
    usage: '/sc [message]'
    aliases:
      - sc
    permission: conclave.staffchat

  staffchattoggle:
    description: Toggle automatic staff chat mode.
    usage: '/sctoggle'
    aliases:
      - sctoggle
    permission: conclave.staffchat

  conclave:
    description: Main Conclave plugin command.
    usage: '/conclave <help|reload|version>'
    aliases:
      - cv

permissions:
  conclave.staffchat:
    description: Allows sending and receiving staff chat messages.
    default: op

  conclave.staffchat.bypass-cooldown:
    description: Bypasses the staff chat message cooldown.
    default: op
    children:
      conclave.staffchat: true

  conclave.help:
    description: Allows viewing Conclave help.
    default: true

  conclave.version:
    description: Allows viewing plugin information.
    default: true

  conclave.reload:
    description: Allows reloading Conclave configuration.
    default: op
